name: Matrix-Hub Ecosystem Bot

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  schedule:
    - cron: '0 8 * * *' # Runs daily maintenance checks every morning

permissions:
  contents: write

jobs:
  matrix-engineer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Run Matrix-Hub Automation Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # Or your preferred LLM key
        run: |
          npm install
          node scripts/matrix-bot-core.js
          node scripts/polygon-error-bot.js
          node scripts/test-polygon-live.js
          node scripts/test-mtx-and-wallets.js

      - name: Commit auto-fixes
        if: github.event_name == 'schedule'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "matrix-hub-bot"
            git config user.email "matrix-hub-bot@users.noreply.github.com"
            git add src scripts public
            git commit -m "chore(bot): auto-fix issues found by Matrix-Hub bot" || exit 0
            git push
          fi
