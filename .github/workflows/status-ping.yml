# Status ping — the Glass Wall's status monitor (Clubhouse Phase 2).
#
# DESTINATION: .github/workflows/status-ping.yml in this repo.
# The ping script it runs lives at .github/scripts/ping-status.mjs.
#
# WHAT IT DOES: about every 30 minutes it pings the site's key public
# URLs (the list lives in the script), and publishes the result as
# status.json on the dedicated `status` branch. The Glass Wall's
# status panel reads that file over raw.githubusercontent.com:
#   https://raw.githubusercontent.com/bran8912-ctrl/Matrix-Hub.org/status/status.json
#
# WHY IT EXISTS: the status feed used to wait on a separate Upptime
# repo and a personal access token. Brandon's call (2026-11-18):
# "figure out a work around." This is the workaround — everything
# inside infrastructure this repo already has. NO new repo, NO PAT:
# the only credential is the workflow's built-in GITHUB_TOKEN, scoped
# to this repo by GitHub itself.
#
# HOW IT PUBLISHES (revised 2026-11-19, after live run #1): through
# the GitHub Contents API, from inside the script — there is NO git
# push anywhere in this workflow. Run #1's pings all passed but its
# git-push publish was rejected by a repository ruleset (GH013):
# ref creation on the status branch is restricted, and commits must
# have verified signatures (a local git commit is unsigned). HQ's
# ruling: comply with the ruleset, do not weaken it. So:
#   - The `status` branch is created ONCE by the repo owner through
#     the GitHub web UI. This workflow ASSUMES it exists; if it does
#     not, the script fails the run with one clear line and writes
#     nothing.
#   - The script publishes with a single Contents API PUT
#     (PUT /repos/{repo}/contents/status.json, branch=status,
#     GITHUB_TOKEN auth, carrying the file's current blob SHA when
#     updating). Commits created through the API are signed by
#     GitHub and show as Verified — the signature rule is satisfied
#     by construction.
#   - The script calls the API's write ONLY when a check actually
#     flipped state (its proven change detection): a no-change run
#     makes no API write at all, so status-branch commits stay rare
#     and each one means something went up or down.
#
# DESIGN FACTS (verified 2026-11-18/19, see
# bot-core/clubhouse/status-feed/README.md for the evidence):
#   - raw.githubusercontent.com serves Access-Control-Allow-Origin: *,
#     so the browser panel can fetch the file cross-origin.
#   - This repo is public and its default branch is Hub10, so the
#     schedule below (schedules only fire from the default branch)
#     works from here.
#   - The Pages deploy workflow (astro.yml) triggers ONLY on pushes
#     to Hub10 — and API commits made with GITHUB_TOKEN do not
#     trigger push workflows at all — so status-branch commits can
#     never cause a site deploy.
#
# ONE SETTING TO KNOW: publishing needs the repo's Actions workflow
# permissions to allow writes (Settings → Actions → General →
# Workflow permissions → "Read and write permissions"). The
# `permissions:` block below asks for exactly contents:write; if the
# repo setting caps it at read-only, the publish PUT fails with a
# 403 and that toggle is the fix. No token is involved either way.

name: Status ping

on:
  schedule:
    # Every 30 minutes. GitHub may delay scheduled runs under load;
    # the panel's per-check "since" times stay truthful regardless.
    - cron: "*/30 * * * *"
  # Lets HQ fire a publish immediately, instead of waiting for the
  # next cron tick (e.g. the first run after the owner creates the
  # status branch in the web UI).
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs race the same file — a stale blob SHA would 409.
concurrency:
  group: status-ping
  cancel-in-progress: false

jobs:
  ping:
    name: Ping key URLs and publish on change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the ping script)
        uses: actions/checkout@v4

      # The script does everything else itself: branch check, fetch
      # of the previously published file, the pings, the merge, and —
      # only if a check flipped — the Contents API publish. Repo and
      # API URL come from the environment Actions always sets
      # (GITHUB_REPOSITORY / GITHUB_API_URL); the token likewise.
      - name: Ping the checks and publish on change
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/ping-status.mjs --publish
