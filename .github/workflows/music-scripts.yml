name: Music Track Scripts

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Music script to run'
        required: true
        type: choice
        options:
          - 'scrape-mixkit-tracks'
          - 'parse-mixkit-tracks'
          - 'scrape-and-parse-mixkit'
          - 'test-tracks'
          - 'test-corsproxy-tracks'
          - 'test-fma-tracks'
          - 'test-pixabay-tracks'

jobs:
  run-music-script:
    name: Run ${{ inputs.script }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          cat << 'EOF' > requirements.txt
          requests==2.32.3
          beautifulsoup4==4.12.3
          EOF
          pip install -r requirements.txt
      
      - name: Run scrape-mixkit-tracks
        if: inputs.script == 'scrape-mixkit-tracks'
        run: |
          set -o pipefail
          echo "## 🎵 Scrape Mixkit Tracks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Scraping ambient music tracks from Mixkit..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          python scripts/scrape_mixkit_tracks.py | tee scrape-output.txt
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat scrape-output.txt || echo "No output captured"
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          if [ -f "matrix_tracks_snippet.txt" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Track data generated successfully" >> $GITHUB_STEP_SUMMARY
            
            # Also create the pipe-delimited format for parse script
            mkdir -p /tmp
            sed 's/{ title: "\([^"]*\)", artist: "\([^"]*\)", url: "\([^"]*\)" },/\1 | \2 | \3/g' matrix_tracks_snippet.txt > /tmp/matrix_new_tracks.txt
            echo "ℹ️ Also created /tmp/matrix_new_tracks.txt for use with parse-mixkit-tracks" >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Run parse-mixkit-tracks
        if: inputs.script == 'parse-mixkit-tracks'
        run: |
          set -o pipefail
          echo "## 📝 Parse Mixkit Tracks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Note:** This script requires \`/tmp/matrix_new_tracks.txt\` generated by \`scrape-mixkit-tracks\`." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Create a sample file for testing if it doesn't exist
          if [ ! -f "/tmp/matrix_new_tracks.txt" ]; then
            echo "ℹ️ Creating sample track file for demonstration (run scrape-mixkit-tracks first for real data)..." >> $GITHUB_STEP_SUMMARY
            mkdir -p /tmp
            echo "Track 1 | Artist 1 | https://example.com/track1.mp3" > /tmp/matrix_new_tracks.txt
            echo "Track 2 | Artist 2 | https://example.com/track2.mp3" >> /tmp/matrix_new_tracks.txt
          fi
          
          python scripts/parse_mixkit_tracks.py | tee parse-output.txt
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Parsed Tracks:" >> $GITHUB_STEP_SUMMARY
          echo '```javascript' >> $GITHUB_STEP_SUMMARY
          cat parse-output.txt || echo "No output captured"
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Run scrape-and-parse-mixkit (chained)
        if: inputs.script == 'scrape-and-parse-mixkit'
        run: |
          set -o pipefail
          echo "## 🎵📝 Scrape and Parse Mixkit Tracks (Chained)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Step 1: Scrape
          echo "### Step 1: Scraping tracks from Mixkit..." >> $GITHUB_STEP_SUMMARY
          python scripts/scrape_mixkit_tracks.py | tee scrape-output.txt
          
          if [ -f "matrix_tracks_snippet.txt" ]; then
            echo "✅ Scrape completed successfully" >> $GITHUB_STEP_SUMMARY
            
            # Convert to pipe-delimited format
            mkdir -p /tmp
            sed 's/{ title: "\([^"]*\)", artist: "\([^"]*\)", url: "\([^"]*\)" },/\1 | \2 | \3/g' matrix_tracks_snippet.txt > /tmp/matrix_new_tracks.txt
            
            # Step 2: Parse
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Step 2: Parsing track data..." >> $GITHUB_STEP_SUMMARY
            python scripts/parse_mixkit_tracks.py | tee parse-output.txt
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Parsed Tracks:" >> $GITHUB_STEP_SUMMARY
            echo '```javascript' >> $GITHUB_STEP_SUMMARY
            cat parse-output.txt || echo "No output captured"
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ Scrape and parse completed successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Scrape failed - cannot proceed to parse" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
      
      - name: Run test-tracks
        if: inputs.script == 'test-tracks'
        run: |
          echo "## 🧪 Test Music Tracks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Testing music track URLs from index.html..." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check if docs/index.html exists
          if [ -f "docs/index.html" ]; then
            python scripts/test_tracks.py | tee test-tracks-output.txt || true
            
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Test Results:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test-tracks-output.txt || echo "No output captured"
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ docs/index.html not found. Skipping track tests." >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Run test-corsproxy-tracks
        if: inputs.script == 'test-corsproxy-tracks'
        run: |
          echo "## 🔗 Test CORS Proxy Tracks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          python scripts/test_corsproxy_tracks.py | tee test-corsproxy-output.txt || true
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-corsproxy-output.txt || echo "No output captured"
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Run test-fma-tracks
        if: inputs.script == 'test-fma-tracks'
        run: |
          echo "## 🎼 Test Free Music Archive Tracks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          python scripts/test_fma_tracks.py | tee test-fma-output.txt || true
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-fma-output.txt || echo "No output captured"
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Run test-pixabay-tracks
        if: inputs.script == 'test-pixabay-tracks'
        run: |
          echo "## 🎨 Test Pixabay Tracks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          python scripts/test_pixabay_tracks.py | tee test-pixabay-output.txt || true
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat test-pixabay-output.txt || echo "No output captured"
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: music-script-output-${{ inputs.script }}-${{ github.run_number }}
          path: |
            scrape-output.txt
            parse-output.txt
            test-tracks-output.txt
            test-corsproxy-output.txt
            test-fma-output.txt
            test-pixabay-output.txt
            matrix_tracks_snippet.txt
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "✅ Music script completed" >> $GITHUB_STEP_SUMMARY
          echo "📦 Results available in artifacts" >> $GITHUB_STEP_SUMMARY
