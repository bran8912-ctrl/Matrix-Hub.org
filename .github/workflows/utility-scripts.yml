name: Utility Scripts

on:
  workflow_dispatch:
    inputs:
      script:
        description: 'Utility script to run'
        required: true
        type: choice
        options:
          - 'generate-password-hash'
          - 'get-matrix-music'
          - 'fix-casino-deploy'
      # ⚠️ Do not pass passwords via workflow_dispatch inputs.
      # For generate-password-hash, run the script locally instead of using this workflow.

jobs:
  run-utility:
    name: Run ${{ inputs.script }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run generate-password-hash
        if: inputs.script == 'generate-password-hash'
        run: |
          echo "## 🔐 Generate Password Hash" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Security Warning:** This workflow uses an example password for demonstration only." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**To generate a real password hash:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Run the script locally: \`node scripts/generate-password-hash.js \"your-password\"\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Never pass real passwords through workflow inputs (they appear in logs)" >> $GITHUB_STEP_SUMMARY
          echo "3. Store the hash in GitHub Secrets for production use" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          PASSWORD="example-password-for-demonstration"
          node scripts/generate-password-hash.js "$PASSWORD" > password-hash-output.txt
          
          echo "✅ Example hash generated and saved to artifact 'password-hash-output.txt'" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **Security Notice:**" >> $GITHUB_STEP_SUMMARY
          echo "- Never commit passwords or hashes to the repository" >> $GITHUB_STEP_SUMMARY
          echo "- SHA-256 is fast and vulnerable to brute-force attacks" >> $GITHUB_STEP_SUMMARY
          echo "- For production, consider using bcrypt, scrypt, or Argon2" >> $GITHUB_STEP_SUMMARY
          echo "- This is intended for client-side authentication only (not truly secure)" >> $GITHUB_STEP_SUMMARY
      
      - name: Run get-matrix-music
        if: inputs.script == 'get-matrix-music'
        run: |
          echo "## 🎵 Download Matrix Music Assets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          chmod +x scripts/get-matrix-music.sh
          ./scripts/get-matrix-music.sh | tee music-download-output.txt
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Downloaded Files:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh public/music/ 2>/dev/null || echo "No files downloaded"
          echo '```' >> $GITHUB_STEP_SUMMARY
      
      - name: Run fix-casino-deploy
        if: inputs.script == 'fix-casino-deploy'
        run: |
          echo "## 🎰 Fix Casino Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          chmod +x scripts/fix-casino-deploy.sh
          ./scripts/fix-casino-deploy.sh | tee fix-output.txt
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ℹ️ **Note:** This is a placeholder utility script." >> $GITHUB_STEP_SUMMARY
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: utility-script-output-${{ inputs.script }}-${{ github.run_number }}
          path: |
            password-hash-output.txt
            music-download-output.txt
            fix-output.txt
            public/music/CREDITS.txt
            public/music/matrix-hub.m3u
          if-no-files-found: ignore
          retention-days: 7
      
      - name: Summary
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "✅ Utility script completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "📦 Artifacts available for download" >> $GITHUB_STEP_SUMMARY
