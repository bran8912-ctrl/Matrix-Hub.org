name: Treasury Check — MTX Certification

# Read-only on-chain certification for the verified MTX token
# (MatrixHubCoin 0x53307e1db6c5cb6773c9495ca140372016dfe266, Polygon 137).
#
# Runs on manual dispatch, and automatically when the check script or
# this workflow itself changes (paths filter only — no schedule, no
# general push trigger). The evidence packet is uploaded as a run
# artifact only: Hub10 is a protected branch (GH013 — changes must go
# through a PR, verified signatures required), so no workflow step may
# commit back to the repo. Do NOT re-add a commit-back step.
# No secret is ever printed: treasury_check.py reads the API key from
# the environment only and never logs it, and the step logs contain no
# key material.

"on":
  workflow_dispatch:
  push:
    branches: [Hub10]
    paths:
      - 'scripts/treasury_check.py'
      - '.github/workflows/treasury-check.yml'

jobs:
  treasury-check:
    name: MTX two-source treasury check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run treasury check (RPC fallback)
        env:
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
          # Optional authenticated Polygon RPC (Alchemy). When the
          # POLYGON_RPC_URL secret is configured it is tried FIRST;
          # when it is absent the variable is empty and only the
          # public RPCs below are tried. The URL carries its key in
          # the path, so it is NEVER echoed raw — see sanitize_rpc.
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
        run: |
          set +e
          set +o pipefail
          # Redact an API-key-like trailing path segment (e.g. Alchemy
          # /v2/<key>) so the key never appears in logs. Mirrors
          # _sanitize_url() in treasury_check.py. Hostnames and short
          # segments (e.g. /matic) are untouched.
          sanitize_rpc() {
            printf '%s' "$1" | sed -E 's#(/[^/]+/)[A-Za-z0-9_-]{16,}$#\1<redacted>#'
          }
          # Self-test first: selectors must verify before any network call.
          python3 scripts/treasury_check.py --dry-run
          if [ $? -ne 0 ]; then
            echo "Dry-run self-test FAILED — aborting." >&2
            exit 1
          fi
          rc=1
          # RPCs, in order. The authenticated POLYGON_RPC_URL (Alchemy)
          # goes first when configured: GitHub Actions runner IPs are
          # systematically Cloudflare-blocked (1010) on the public
          # RPCs (verified run 42765953276 — all four public RPCs 403).
          # polygon-rpc.com (401 tenant-disabled), polygon.llamarpc.com
          # (DNS dead), rpc.ankr.com/polygon (needs its own API key) and
          # polygon-mainnet.public.blastapi.io (BlastAPI public endpoint
          # retired — "Blast API is no longer available", run
          # 42765953276) are NOT in this list.
          RPCS=(
            https://polygon-bor-rpc.publicnode.com
            https://1rpc.io/matic
            https://polygon.drpc.org
          )
          if [ -n "${POLYGON_RPC_URL:-}" ]; then
            RPCS=("$POLYGON_RPC_URL" "${RPCS[@]}")
          fi
          for rpc in "${RPCS[@]}"; do
            echo "--- trying RPC: $(sanitize_rpc "$rpc")"
            python3 scripts/treasury_check.py --rpc "$rpc" --out treasury-check.json 2>&1 | tee treasury-check.log
            rc=${PIPESTATUS[0]}
            if [ "$rc" -eq 0 ]; then
              echo "Treasury check PASSED with RPC $(sanitize_rpc "$rpc")"
              break
            fi
            if grep -q "ERROR source 1" treasury-check.log; then
              echo "Source 1 failed on $(sanitize_rpc "$rpc") — trying next RPC."
              continue
            fi
            echo "Check failed for a reason other than source 1 (exit $rc) — stopping."
            break
          done
          # Write the verdict into the job summary (no secrets in output).
          python3 - <<'PYEOF'
          import json
          import os
          try:
              with open("treasury-check.json", encoding="utf-8") as fh:
                  packet = json.load(fh)
              verdict = packet.get("verdict", "UNKNOWN")
              agree = packet.get("two_source_agree")
              errors = packet.get("errors") or []
          except Exception as exc:  # noqa: BLE001
              verdict = "UNKNOWN (no evidence packet written)"
              agree = None
              errors = [str(exc)]
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          with open(summary_path, "a", encoding="utf-8") as out:
              out.write("## Treasury check — MTX\n\n")
              out.write("**Verdict:** %s\n\n" % verdict)
              out.write("**Two-source agreement:** %s\n\n" % agree)
              if errors:
                  out.write("**Errors:**\n\n")
                  for err in errors:
                      out.write("- %s\n" % err)
          PYEOF
          exit $rc

      - name: Upload evidence packet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-check-evidence
          path: |
            treasury-check.json
            treasury-check.log
          if-no-files-found: warn
          retention-days: 90
