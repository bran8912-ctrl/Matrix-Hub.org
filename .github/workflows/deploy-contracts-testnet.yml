name: Contract Deployment - Polygon Testnet (Amoy)

# Safe testnet deployment for Polygon Amoy (Chain ID: 80002)
#
# Required GitHub Secrets:
#   TESTNET_PRIVATE_KEY   - Deployer wallet private key (without 0x prefix)
#   AMOY_RPC_URL          - Polygon Amoy RPC endpoint
#   POLYGONSCAN_API_KEY   - PolygonScan API key (optional, for verification)
#
# Get free Amoy MATIC from: https://faucet.polygon.technology/

on:
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Deployment type'
        required: true
        type: choice
        options:
          - 'mtx-only'
          - 'casino-only'
          - 'distribute-only'
          - 'full-deployment'
      skip_compilation:
        description: 'Skip contract compilation (use cached artifacts)'
        required: false
        type: boolean
        default: false

jobs:
  validate-network:
    name: Validate Testnet Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate testnet-only
        run: |
          echo "## 🔒 Polygon Amoy Testnet Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow deploys to **Polygon Amoy Testnet** (Chain ID: 80002)." >> $GITHUB_STEP_SUMMARY
          echo "No real funds at risk — uses free testnet MATIC from the Polygon faucet." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Type:** \`${{ inputs.deployment_type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Testnet deployment validated" >> $GITHUB_STEP_SUMMARY

  compile-contracts:
    name: Compile Smart Contracts
    runs-on: ubuntu-latest
    needs: validate-network
    if: ${{ inputs.skip_compilation == false }}
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: |
          echo "## 🔨 Compiling Smart Contracts" >> $GITHUB_STEP_SUMMARY
          npm run compile
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Compilation successful" >> $GITHUB_STEP_SUMMARY

      - name: Upload compiled contracts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contracts-amoy-${{ github.run_number }}
          path: |
            artifacts/
            cache/
          retention-days: 7

  deploy-mtx:
    name: Deploy MTX Token to Polygon Amoy
    runs-on: ubuntu-latest
    needs: [validate-network, compile-contracts]
    if: |
      always() &&
      needs.validate-network.result == 'success' &&
      (needs.compile-contracts.result == 'success' || needs.compile-contracts.result == 'skipped') &&
      (inputs.deployment_type == 'mtx-only' || inputs.deployment_type == 'full-deployment')
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download compiled contracts
        if: ${{ inputs.skip_compilation == false }}
        uses: actions/download-artifact@v4
        with:
          name: compiled-contracts-amoy-${{ github.run_number }}

      - name: Create deployments directory
        run: mkdir -p deployments

      - name: Deploy MTX Token to Polygon Amoy
        env:
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: |
          echo "## 🚀 Deploying MTX Token to Polygon Amoy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** amoy (Chain ID: 80002)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          npx hardhat run scripts/deploy_mtx.js --network amoy 2>&1 | tee deploy_mtx_amoy_output.log

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -25 deploy_mtx_amoy_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify contract on Amoy PolygonScan (optional)
        env:
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: |
          if [ -z "$POLYGONSCAN_API_KEY" ]; then
            echo "PolygonScan API key not set — skipping verification"
          else
            CONTRACT_ADDRESS=$(node -e "const d=require('./deployments/mtx-amoy.json'); console.log(d.contractAddress)")
            echo "Verifying contract at $CONTRACT_ADDRESS on Amoy PolygonScan..."
            npx hardhat verify --network amoy "$CONTRACT_ADDRESS" "100000000" "0x9fb4bb44d8d962d695fc93b3dc15f1b287391077" || echo "Verification failed - verify manually"
          fi

      - name: Upload MTX deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtx-deployment-amoy-${{ github.run_number }}
          path: |
            deployments/mtx-amoy.json
            deploy_mtx_amoy_output.log
          retention-days: 30

  deploy-casino:
    name: Deploy Casino Contracts to Polygon Amoy
    runs-on: ubuntu-latest
    needs: [validate-network, compile-contracts, deploy-mtx]
    if: |
      always() &&
      needs.validate-network.result == 'success' &&
      (needs.compile-contracts.result == 'success' || needs.compile-contracts.result == 'skipped') &&
      (needs.deploy-mtx.result == 'success' || inputs.deployment_type == 'casino-only') &&
      (inputs.deployment_type == 'casino-only' || inputs.deployment_type == 'full-deployment')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download compiled contracts
        if: ${{ inputs.skip_compilation == false }}
        uses: actions/download-artifact@v4
        with:
          name: compiled-contracts-amoy-${{ github.run_number }}

      - name: Download MTX deployment
        if: inputs.deployment_type == 'full-deployment'
        uses: actions/download-artifact@v4
        with:
          name: mtx-deployment-amoy-${{ github.run_number }}
          path: deployments/

      - name: Create deployments directory
        run: mkdir -p deployments

      - name: Deploy Casino Contracts to Polygon Amoy
        env:
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: |
          echo "## 🎰 Deploying Casino Contracts to Polygon Amoy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** amoy (Chain ID: 80002)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          npx hardhat run scripts/deploy_casino.js --network amoy 2>&1 | tee deploy_casino_amoy_output.log

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 deploy_casino_amoy_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Casino deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: casino-deployment-amoy-${{ github.run_number }}
          path: |
            deployments/casino-amoy.json
            deploy_casino_amoy_output.log
          retention-days: 30

  distribute-mtx:
    name: Distribute MTX Tokens on Polygon Amoy
    runs-on: ubuntu-latest
    needs: [validate-network, compile-contracts, deploy-mtx, deploy-casino]
    if: |
      always() &&
      needs.validate-network.result == 'success' &&
      (needs.compile-contracts.result == 'success' || needs.compile-contracts.result == 'skipped') &&
      ((needs.deploy-mtx.result == 'success' && needs.deploy-casino.result == 'success') || inputs.deployment_type == 'distribute-only') &&
      (inputs.deployment_type == 'distribute-only' || inputs.deployment_type == 'full-deployment')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download compiled contracts
        if: ${{ inputs.skip_compilation == false }}
        uses: actions/download-artifact@v4
        with:
          name: compiled-contracts-amoy-${{ github.run_number }}

      - name: Download MTX deployment
        if: inputs.deployment_type == 'full-deployment'
        uses: actions/download-artifact@v4
        with:
          name: mtx-deployment-amoy-${{ github.run_number }}
          path: deployments/

      - name: Download Casino deployment
        if: inputs.deployment_type == 'full-deployment'
        uses: actions/download-artifact@v4
        with:
          name: casino-deployment-amoy-${{ github.run_number }}
          path: deployments/

      - name: Create deployments directory
        run: mkdir -p deployments

      - name: Distribute MTX to Ecosystem on Polygon Amoy
        env:
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          AMOY_RPC_URL: ${{ secrets.AMOY_RPC_URL }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: |
          echo "## 💰 Distributing MTX Tokens on Polygon Amoy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** amoy (Chain ID: 80002)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          npx hardhat run scripts/distribute_mtx.js --network amoy 2>&1 | tee distribute_mtx_amoy_output.log

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Distribution Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -40 distribute_mtx_amoy_output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mtx-distribution-amoy-${{ github.run_number }}
          path: |
            deployments/mtx-distribution-amoy.json
            distribute_mtx_amoy_output.log
          retention-days: 30

  deployment-summary:
    name: Amoy Testnet Deployment Summary
    runs-on: ubuntu-latest
    needs: [validate-network, deploy-mtx, deploy-casino, distribute-mtx]
    if: always()
    permissions:
      contents: read

    steps:
      - name: Generate deployment summary
        run: |
          echo "# 📋 Polygon Amoy Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Network:** Polygon Amoy Testnet (Chain ID: 80002)" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Type:** \`${{ inputs.deployment_type }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Run Number:** #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## Job Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Network Validation | ${{ needs.validate-network.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MTX Deployment | ${{ needs.deploy-mtx.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Casino Deployment | ${{ needs.deploy-casino.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MTX Distribution | ${{ needs.distribute-mtx.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "## 🚀 Next Steps (After Testnet Success)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Download deployment artifacts from this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify contract on [Amoy PolygonScan](https://amoy.polygonscan.com)" >> $GITHUB_STEP_SUMMARY
          echo "3. Test \`buyMTX\` with testnet MATIC (get from https://faucet.polygon.technology)" >> $GITHUB_STEP_SUMMARY
          echo "4. Run \`deploy-contracts-mainnet.yml\` for Polygon Mainnet when ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Required Secrets (set in repo Settings → Secrets → Actions)" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Purpose |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`TESTNET_PRIVATE_KEY\` | Burner wallet key for Amoy (no real funds needed) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`AMOY_RPC_URL\` | Polygon Amoy RPC (default: https://rpc-amoy.polygon.technology/) |" >> $GITHUB_STEP_SUMMARY
          echo "| \`POLYGONSCAN_API_KEY\` | Optional — for contract verification |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Matrix-Hub.org** — Signal Over Noise 🌟" >> $GITHUB_STEP_SUMMARY
