# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# SLSA Provenance workflow for Matrix-Hub.org
# Generates SLSA Level 3 provenance for reproducible, verifiable builds
# Builds: Astro static site (npm run build) + Smart contracts (npx hardhat compile)
# Outputs provenance for: /dist and /artifacts
# 
# This workflow satisfies level 3 for the provenance requirements - see https://slsa.dev/spec/v0.1/requirements
# The project is an initiative of the OpenSSF (openssf.org) and is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using https://github.com/slsa-framework/slsa-verifier.
# For more information about SLSA and how it improves the supply-chain, visit slsa.dev.

name: SLSA generic generator
on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ========================================================
      #
      # Step 1: Build Matrix-Hub.org artifacts
      #
      # ========================================================
      - name: Build Astro static site
        run: npm run build

      - name: Compile smart contracts
        run: npm run compile

      # ========================================================
      #
      # Step 2: Generate provenance subjects for verifiable builds
      #
      # ========================================================
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail

          # Create temporary file list
          tempfile=$(mktemp)
          
          # List all files in dist/ directory (Astro static site output)
          if [ -d "dist" ]; then
            find dist -type f -print0 >> "$tempfile"
          fi
          
          # List all files in artifacts/ directory (Hardhat contract compilation output)
          if [ -d "artifacts" ]; then
            find artifacts -type f -name "*.json" -print0 >> "$tempfile"
          fi
          
          # Generate SHA256 hashes for all artifacts
          if [ -s "$tempfile" ]; then
            echo "digests=$(xargs -0 sha256sum < "$tempfile" | base64 -w0)" >> "${GITHUB_OUTPUT}"
          else
            echo "Error: No artifacts found to generate provenance for"
            exit 1
          fi
          
          # Cleanup
          rm "$tempfile"

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Upload to release when triggered by release event
