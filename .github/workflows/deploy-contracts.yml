name: Smart Contract Deployment (LEGACY)

# ⚠️ WARNING: This workflow is for reference only
# For testnet deployments, use: deploy-contracts-testnet.yml
# For mainnet deployments, use MANUAL deployment only (see DEPLOYMENT_GUIDE.md)

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy to (MAINNET DEPLOYMENTS MUST BE MANUAL)'
        required: true
        type: choice
        options:
          - 'sepolia'
          - 'mainnet'
      contract:
        description: 'Contract to deploy'
        required: true
        type: choice
        options:
          - 'mtx'
          - 'casino'
      confirm:
        description: 'Type "DEPLOY" to confirm (required for mainnet)'
        required: true
        type: string

jobs:
  validate-deployment:
    name: Validate Deployment Request
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Check confirmation
        run: |
          NORMALIZED_CONFIRM=$(echo "${{ inputs.confirm }}" | tr '[:lower:]' '[:upper:]' | xargs)
          if [ "${{ inputs.network }}" == "mainnet" ] && [ "$NORMALIZED_CONFIRM" != "DEPLOY" ]; then
            echo "❌ Mainnet deployment requires confirmation" >> $GITHUB_STEP_SUMMARY
            echo "Please type 'DEPLOY' in the confirmation field" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          
          echo "✅ Deployment request validated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Network:** ${{ inputs.network }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Contract:** ${{ inputs.contract }}" >> $GITHUB_STEP_SUMMARY

  compile-contracts:
    name: Compile Contracts
    runs-on: ubuntu-latest
    needs: validate-deployment
    permissions:
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Compile contracts
        run: |
          echo "## 🔨 Compiling Smart Contracts" >> $GITHUB_STEP_SUMMARY
          npm run compile
          echo "✅ Compilation successful" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-contracts
          path: |
            artifacts/
            cache/
          retention-days: 7

  deploy-info:
    name: Deployment Information
    runs-on: ubuntu-latest
    needs: [validate-deployment, compile-contracts]
    permissions:
      contents: read
    
    steps:
      - name: Display deployment info
        run: |
          echo "## 🚨 DEPRECATION NOTICE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This workflow is **deprecated** and for reference only." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Recommended Workflows" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Testnet Deployments:** Use \`deploy-contracts-testnet.yml\` workflow" >> $GITHUB_STEP_SUMMARY
          echo "- **Mainnet Deployments:** Use **MANUAL** deployment only" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📖 Documentation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See \`DEPLOYMENT_GUIDE.md\` for complete deployment instructions." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📋 Deployment Information (Legacy)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **IMPORTANT:** This is a manual deployment workflow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration Required" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To complete the deployment, you need to:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Set up deployment secrets in repository settings:" >> $GITHUB_STEP_SUMMARY
          echo "   - \`PRIVATE_KEY\`: Deployer wallet private key (testnet)" >> $GITHUB_STEP_SUMMARY
          echo "   - \`TESTNET_PRIVATE_KEY\`: Deployer wallet private key (testnet - recommended)" >> $GITHUB_STEP_SUMMARY
          echo "   - \`SEPOLIA_RPC_URL\`: RPC provider URL for Sepolia" >> $GITHUB_STEP_SUMMARY
          echo "   - \`ETHERSCAN_API_KEY\`: For contract verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "2. Update \`hardhat.config.cjs\` with network configurations" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "3. Run the deployment script locally (recommended for mainnet):" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   npm run deploy:${{ inputs.network }}:${{ inputs.contract }}" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔒 Security Notice" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ⚠️ **MAINNET DEPLOYMENTS MUST BE DONE MANUALLY**" >> $GITHUB_STEP_SUMMARY
          echo "- Never commit private keys to the repository" >> $GITHUB_STEP_SUMMARY
          echo "- Always verify contract addresses after deployment" >> $GITHUB_STEP_SUMMARY
          echo "- For mainnet deployments, use a hardware wallet or secure key management" >> $GITHUB_STEP_SUMMARY
          echo "- Test thoroughly on testnet before mainnet deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Requested Deployment:**" >> $GITHUB_STEP_SUMMARY
          echo "- Network: ${{ inputs.network }}" >> $GITHUB_STEP_SUMMARY
          echo "- Contract: ${{ inputs.contract }}" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered by: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Time: $(date -u)" >> $GITHUB_STEP_SUMMARY
