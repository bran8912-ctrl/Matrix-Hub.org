name: Verify Amoy Contracts on PolygonScan

# Verifies the four mock-VRF Amoy casino contracts on PolygonScan
# (RNGEngine, CasinoReserve, LiquidityRouter, CasinoCore — deployed
# 2026-11-10, mock VRF, labelled temporary; ground truth in
# deployments/casino-amoy.json and deployments/amoy-bootstrap.json).
#
# Manual dispatch only. Verification only: no deploys, no transactions,
# no wallet, no private keys. The API key comes from the repo secret
# POLYGONSCAN_API_KEY and is never printed.
#
# Each verify streams its output live (tee to a log file) with a
# 25-minute timeout: run #1 hung 41 minutes on the first verify with
# its output buffered in $(...) so nothing was visible (fixed: stream
# + timeout). Run #2 then showed the real problem is PolygonScan-side:
# RNGEngine's source was submitted fine, but PolygonScan returned no
# verification result within 10 minutes, and the failure skipped the
# other three contracts entirely. So each verify step now continues on
# error (a slow contract no longer blocks the rest), and a final
# always-run status step checks all four contracts against the
# PolygonScan API and fails the run loudly if any is still unverified.
# A step that finds its contract already verified reports it and moves
# on (hardhat exits non-zero on "already verified").
#
# Run #3 outcome (2026-11-10): finished 13:55 UTC as Failure after
# 1h 18m — all four verify steps ran and the timeouts worked (RNGEngine
# exactly 25m 0s). It failed only in the Report step: the Etherscan V2
# API returned an error string instead of a list for one contract, and
# the script crashed on it (fixed: tolerate a string result and report
# it instead of crashing). All four contracts were VERIFIED on
# PolygonScan (checked directly 14:37 UTC) — the run's failure was in
# the reporting, not the verifications.

"on":
  workflow_dispatch:

jobs:
  verify-amoy:
    runs-on: ubuntu-latest
    env:
      POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
      # Public RPC that works reliably (default rpc-amoy.polygon.technology
      # was unreachable from some networks); public endpoint, not a secret.
      AMOY_RPC_URL: https://polygon-amoy-bor-rpc.publicnode.com
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Verify RNGEngine
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          timeout 1500 npx hardhat verify --network amoy --contract contracts/RNGEngine.sol:RNGEngine 0x2ED3ab377eCfB30d0360E4f8A13163b55D787DE3 0x03A4B3CE58aCD7374e037d49D271014783D3aF25 1 0x1111111111111111111111111111111111111111111111111111111111111111 250000 3 2>&1 | tee verify-rngengine.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -eq 0 ]; then
            echo "RNGEngine verified"
          elif grep -qi "already verified" verify-rngengine.log; then
            echo "RNGEngine already verified - continuing"
          else
            echo "RNGEngine verification failed (exit $STATUS)" >&2
            exit 1
          fi

      - name: Verify CasinoReserve
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          timeout 1500 npx hardhat verify --network amoy --contract contracts/CasinoReserve.sol:CasinoReserve 0x78128A7deD593Bb7b52973e37DB93bEA76802b58 0x1c05F0283E44b5c13C420d24e05495dC5719548b 1000000000000000000000000 0x0000000000000000000000000000000000000000 2>&1 | tee verify-reserve.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -eq 0 ]; then
            echo "CasinoReserve verified"
          elif grep -qi "already verified" verify-reserve.log; then
            echo "CasinoReserve already verified - continuing"
          else
            echo "CasinoReserve verification failed (exit $STATUS)" >&2
            exit 1
          fi

      - name: Verify LiquidityRouter
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          timeout 1500 npx hardhat verify --network amoy --contract contracts/LiquidityRouter.sol:LiquidityRouter 0xAEcba8F452c3acaA1B8616Ec1194Ca82E01435B3 0x1c05F0283E44b5c13C420d24e05495dC5719548b 0x2bbf8fD7B9d447542c4458D578257059Fd0Be189 2>&1 | tee verify-router.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -eq 0 ]; then
            echo "LiquidityRouter verified"
          elif grep -qi "already verified" verify-router.log; then
            echo "LiquidityRouter already verified - continuing"
          else
            echo "LiquidityRouter verification failed (exit $STATUS)" >&2
            exit 1
          fi

      - name: Verify CasinoCore
        continue-on-error: true
        run: |
          set +e
          set -o pipefail
          timeout 1500 npx hardhat verify --network amoy --contract contracts/CasinoCore.sol:CasinoCore 0xAD42F2e4DfB5D8B0A15745eDdc942cd50aab7D28 0x1c05F0283E44b5c13C420d24e05495dC5719548b 0xAEcba8F452c3acaA1B8616Ec1194Ca82E01435B3 0x78128A7deD593Bb7b52973e37DB93bEA76802b58 0x2ED3ab377eCfB30d0360E4f8A13163b55D787DE3 1000000000000000000 1000000000000000000000 100000000000000000000 0x19dB6AD52b9F701DD436294F250A71B12cd33caB 0x19dB6AD52b9F701DD436294F250A71B12cd33caB 2>&1 | tee verify-core.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -eq 0 ]; then
            echo "CasinoCore verified"
          elif grep -qi "already verified" verify-core.log; then
            echo "CasinoCore already verified - continuing"
          else
            echo "CasinoCore verification failed (exit $STATUS)" >&2
            exit 1
          fi

      - name: Report verification status
        if: always()
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, sys
          addrs = {
            "RNGEngine": "0x2ED3ab377eCfB30d0360E4f8A13163b55D787DE3",
            "CasinoReserve": "0x78128A7deD593Bb7b52973e37DB93bEA76802b58",
            "LiquidityRouter": "0xAEcba8F452c3acaA1B8616Ec1194Ca82E01435B3",
            "CasinoCore": "0xAD42F2e4DfB5D8B0A15745eDdc942cd50aab7D28",
          }
          import os
          key = os.environ["POLYGONSCAN_API_KEY"]
          failed = []
          for name, addr in addrs.items():
            url = ("https://api.etherscan.io/v2/api?chainid=80002&module=contract"
                   "&action=getsourcecode&address=" + addr + "&apikey=" + key)
            with urllib.request.urlopen(url, timeout=60) as r:
              data = json.load(r)
            res = data.get("result")
            if isinstance(res, list) and res and isinstance(res[0], dict):
              src = res[0].get("SourceCode", "")
            else:
              # API error (e.g. rate limit): result is a string, not a list.
              print(f"{name} {addr}: API error — {res!r}", file=sys.stderr)
              src = ""
            ok = bool(src) and src != "0x"
            print(f"{name} {addr}: {'VERIFIED' if ok else 'UNVERIFIED'}")
            if not ok:
              failed.append(name)
          if failed:
            print("Still unverified: " + ", ".join(failed), file=sys.stderr)
            sys.exit(1)
          print("All four contracts verified on PolygonScan Amoy.")
          PYEOF
