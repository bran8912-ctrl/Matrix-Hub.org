<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Bullet Dodge</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../matrix-competitive.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>BULLET TIME</h1>
            <div class="stats">
                <div class="stat">
                    <span class="label">SCORE:</span>
                    <span id="score">0</span>
                </div>
                <div class="stat">
                    <span class="label">LEVEL:</span>
                    <span id="level">1</span>
                </div>
                <div class="stat">
                    <span class="label">BEST:</span>
                    <span id="best"></span>
                </div>
                <div class="stat">
                    <span class="label">LIVES:</span>
                    <span id="lives">❤❤❤</span>
                </div>
            </div>
        </div>
        
        <div id="mh-challenge" class="mh-banner"></div>
        <div id="mh-streak" class="mh-streak"></div>
        <canvas id="game-canvas"></canvas>
        
        <div id="game-over" class="overlay hidden">
            <h2>CONNECTION LOST</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <p>Level Reached: <span id="final-level">1</span></p>
            <p id="mh-newbest" class="mh-newbest" hidden>NEW BEST!</p>
            <p id="mh-best-line" class="mh-best-line"></p>
            <p id="mh-rank-line" class="mh-rank-line"></p>
            <p id="mh-challenge-result" class="mh-challenge-result"></p>
            <div id="mh-board" class="mh-board"></div>
            <button id="restart-btn">PLAY AGAIN</button>
            <button id="mh-share" class="mh-share-btn" type="button">SHARE SCORE</button>
        </div>
        
        <div id="start-screen" class="overlay">
            <h2>BULLET TIME</h2>
            <p>Use arrow keys, WASD, or touch to dodge the bullets</p>
            <p>Survive as long as possible!</p>
            <button id="start-btn">ENTER THE MATRIX</button>
        </div>
        
        <div class="controls-info">
            <p>🎮 Arrow Keys / WASD to move</p>
            <p>📱 Touch and drag on mobile</p>
        </div>
    </div>
    <script src="../matrix-best.js"></script>
    <script src="script.js"></script>
</body>
</html>
